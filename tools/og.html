<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Шаблон картинки превью</title>
  <!--
    Это не страница сайта, а заготовка для картинки, которая показывается
    при отправке ссылки в мессенджеры. Как пересобрать — см. README, раздел
    «Картинка превью». Размер холста ровно 1200×630.
  -->
  <style>
    /* Те же шрифты, что на сайте (assets/fonts) */
    @font-face { font-family: 'Onest'; font-weight: 400 700; src: url(/assets/fonts/onest-cyrillic.woff2) format('woff2');
                 unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Onest'; font-weight: 400 700; src: url(/assets/fonts/onest-latin.woff2) format('woff2');
                 unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: 'Unbounded'; font-weight: 500 800; src: url(/assets/fonts/unbounded-cyrillic.woff2) format('woff2');
                 unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Unbounded'; font-weight: 500 800; src: url(/assets/fonts/unbounded-latin.woff2) format('woff2');
                 unicode-range: U+0000-00FF, U+2000-206F; }
    :root {
      --accent: #d9744f;
      --accent-2: #e8a04b;
      --bg: #fdf7f0;
      --text: #33261e;
      --text-dim: #7d6656;
      --text-faint: #a08a78;
      --tint: rgba(217, 116, 79, .1);
      --stroke: rgba(122, 84, 60, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Onest', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glow {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(58% 60% at 50% -12%, rgba(242,166,110,.42), transparent 68%),
        radial-gradient(48% 55% at 2% 106%, rgba(228,146,134,.28), transparent 70%),
        radial-gradient(46% 52% at 99% 92%, rgba(243,196,120,.34), transparent 70%);
    }
    .wrap {
      position: relative; z-index: 1;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 0 70px;
    }
    .avatar {
      width: 180px; height: 180px; border-radius: 50%;
      display: grid; place-items: center; overflow: hidden;
      font-size: 70px; font-weight: 600; color: #fff;
      background: linear-gradient(145deg, var(--accent-2), var(--accent));
      box-shadow: 0 22px 46px -18px rgba(217,116,79,.75);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name {
      margin: 26px 0 0;
      font-family: 'Unbounded', 'Segoe UI', sans-serif;
      font-size: 62px; font-weight: 800; letter-spacing: -.04em; line-height: 1;
    }
    .nick {
      margin: 18px 0 0; padding: 6px 22px;
      border-radius: 999px;
      background: var(--text); color: var(--bg);
      font-family: 'Unbounded', 'Segoe UI', sans-serif;
      font-size: 22px; font-weight: 600;
    }
    .nick:empty { display: none; }
    .bio {
      margin: 18px 0 0; max-width: 720px;
      font-size: 28px; line-height: 1.4; color: var(--text-dim);
      text-wrap: balance;   /* иначе последнее слово повисает одно на строке */
      white-space: pre-line; /* \n в описании — перенос, как на странице */
    }
    .bio:empty { display: none; }
    .icons { display: flex; gap: 16px; margin-top: 34px; }
    .ic {
      width: 62px; height: 62px; border-radius: 19px;
      background: var(--tint); color: var(--accent);
      display: grid; place-items: center;
    }
    .url {
      position: absolute; bottom: 34px; left: 0; right: 0;
      font-size: 22px; color: var(--text-faint); letter-spacing: .02em;
    }
    .url:empty { display: none; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="avatar" id="av"></div>
    <h1 class="name" id="nm"></h1>
    <p class="nick" id="nk"></p>
    <p class="bio" id="bio"></p>
    <div class="icons" id="ic"></div>
  </div>
  <div class="url" id="url"></div>

  <script>
    // og.html?lang=en — превью для английской версии (og-en.jpg)
    if (/[?&]lang=en\b/.test(location.search)) document.documentElement.lang = 'en';
  </script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/icons.js"></script>
  <script>
    var C = window.SITE_CONFIG || {};
    var h = C.hero || {}, m = C.meta || {};
    var T = window.SITE_T;
    var name = T(h.name);

    function initials(n) {
      var p = String(n || '').trim().split(/\s+/).slice(0, 2);
      return p.map(function (x) { return x.charAt(0); }).join('').toUpperCase() || '·';
    }

    var av = document.getElementById('av');
    if (h.avatar) {
      var img = new Image();
      img.onload = function () { av.innerHTML = ''; av.appendChild(img); };
      img.onerror = function () { av.textContent = initials(name); };
      img.src = '/' + String(h.avatar).replace(/^\/+/, '');
    } else {
      av.textContent = initials(name);
    }

    document.getElementById('nm').textContent = name;
    document.getElementById('nk').textContent = T(h.nick);
    // То же правило вёрстки, что в app.js: короткие слова не висят в конце строки
    function typo(s) {
      return String(s == null ? '' : s)
        .replace(/(^|[\s(«])([а-яё]{1,2})\s+/gi, '$1$2 ')
        .replace(/\s+—/g, ' —');
    }
    document.getElementById('bio').textContent = typo(T(h.bio));
    document.getElementById('url').textContent =
      (m.url || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');

    // Те же логотипы и то же выравнивание по площади, что и на странице
    var box = document.getElementById('ic');
    // Каждый значок один раз: два одинаковых Telegram подряд выглядят как сбой
    var seen = {};
    (C.links || []).forEach(function (l) {
      var body = (window.SITE_ICONS || {})[l.icon];
      if (!body || seen[l.icon]) return;
      seen[l.icon] = true;
      var d = document.createElement('div');
      d.className = 'ic';
      d.innerHTML = '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><g>' +
        body + '</g></svg>';
      box.appendChild(d);
    });

    document.querySelectorAll('.ic svg > g').forEach(function (g) {
      var b = g.getBBox();
      if (!b.width || !b.height) return;
      var k = Math.sqrt(400 / (b.width * b.height));
      k = Math.min(k, 24 / b.width, 24 / b.height);
      g.setAttribute('transform',
        'translate(' + (12 - (b.x + b.width / 2) * k).toFixed(3) + ' ' +
        (12 - (b.y + b.height / 2) * k).toFixed(3) + ') scale(' + k.toFixed(4) + ')');
    });
  </script>
</body>
</html>
